# Mosquitto MQTT Broker Configuration

# Basic settings
listener 1883
protocol mqtt

# WebSocket listener for browser clients
listener 9001
protocol websockets

# Security settings (allowing anonymous for demo)
allow_anonymous true

# Logging
log_dest stdout
log_type all

# Persistence
persistence true
persistence_location /mosquitto/data/

# Connection settings
max_connections 1000
connection_messages true
